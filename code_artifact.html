        .screen {

            "BLUE ENCOUNT：感情をストレートにぶつけるエモーショナルなロックバンド。",
            "HEY-SMITH：ホーンセクションを擁する熱いスカパンクバンド。",
            "Maki：名古屋発の熱量あふれるライブが持ち味のロックバンド。",
            "マキシマム ザ ホルモン：ハードコアやメタルを独自のポップセンスで昇華した世界的バンド。",
            "め組：菅原達也を中心に結成されたキャッチーなポップスバンド。",
            "WurtS：ジャンルレスな楽曲を生み出す覆面のオルタナティブ・ロック・アーティスト。"
        ];

        // 生テキストから配列データ（パラメータ付き）を生成
        // （要件通り、各軸に -10 〜 10 のランダム値を設定）
        // 毎回ランダムだと同じ回答でも結果が変わるため、乱数シード的役割として文字列のハッシュを利用して固定の疑似乱数を生成します。
        function hashCode(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = ((hash << 5) - hash) + str.charCodeAt(i);
                hash |= 0; 
            }
            return hash;
        }

        function pseudoRandom(seed) {
            let x = Math.sin(seed++) * 10000;
            return x - Math.floor(x);
        }

        const bands = rawBandsText.map(line => {
            const [name, desc] = line.split("：");
            let seed = hashCode(name);
            
            // -10 から 10 までの疑似ランダムな整数を生成
            const getRandParam = () => Math.floor(pseudoRandom(seed++) * 21) - 10;
            
            return {
                name: name,
                description: desc,
                scores: {
                    emotion: getRandParam(),
                    world: getRandParam(),
                    sound: getRandParam(),
                    team: getRandParam(),
                    romance: getRandParam(),
                    style: getRandParam()
                }
            };
        });

        // --- 2. 画面制御ロジック ---

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(el => {
                el.classList.remove('active');
                // アニメーションのためのタイムアウト
                setTimeout(() => {
                    if(!el.classList.contains('active')) el.style.display = 'none';
                }, 400); 
            });
            
            const target = document.getElementById(screenId);
            target.style.display = 'flex';
            // リフローを強制
            void target.offsetWidth; 
            target.classList.add('active');
        }

        function startTest() {
            // スコアとインデックスをリセット
            userScores = { emotion: 0, world: 0, sound: 0, team: 0, romance: 0, style: 0 };
            currentQuestionIndex = 0;
            renderQuestion();
            showScreen('screen-question');
            window.scrollTo(0, 0);
        }

        function renderQuestion() {
            const q = questions[currentQuestionIndex];
            
            // DOM更新
            document.getElementById('q-number').textContent = currentQuestionIndex + 1;
            document.getElementById('q-current').textContent = currentQuestionIndex + 1;
            document.getElementById('q-text').textContent = q.text;
            
            // プログレスバー更新
            const progressPercent = (currentQuestionIndex / questions.length) * 100;
            document.getElementById('q-progress-bar').style.width = `${progressPercent}%`;
        }

        function answerQuestion(point) {
            const q = questions[currentQuestionIndex];
            
            // 極性に合わせてスコアを加算
            const actualPoint = point * q.polarity;
            userScores[q.axis] += actualPoint;

            currentQuestionIndex++;

            if (currentQuestionIndex >= questions.length) {
                calculateResult();
            } else {
                renderQuestion();
            }
        }

        // ユークリッド距離を用いた判定
        function calculateResult() {
            let bestBand = null;
            let minDistance = Infinity;

            bands.forEach(band => {
                // 6軸それぞれの差の2乗を合計する（平方根は省略しても大小関係は変わらないため、そのまま比較）
                let distanceSq = 0;
                for (const axis in userScores) {
                    const diff = userScores[axis] - band.scores[axis];
                    distanceSq += diff * diff;
                }

                if (distanceSq < minDistance) {
                    minDistance = distanceSq;
                    bestBand = band;
                }
            });

            // 結果画面の表示更新
            resultBandData = bestBand;
            document.getElementById('result-band-name').textContent = bestBand.name;
            document.getElementById('result-band-desc').textContent = bestBand.description;
            
            // 進行度バーを100%にする
            document.getElementById('q-progress-bar').style.width = '100%';
            
            setTimeout(() => {
                showScreen('screen-result');
                window.scrollTo(0, 0);
            }, 300); // 最後の回答後、わずかに待ってから切り替え
        }

        function restartTest() {
            showScreen('screen-top');
            window.scrollTo(0, 0);
        }

        function shareSNS(source) {
            let text = "";
            const url = window.location.href; // 実際の公開URLが入ります
            const hashtag = "#邦ロックバンド診断";

            if (source === 'top') {
                text = "全99組からあなたを投影しているバンドがわかる「邦ロックバンド診断」！";
            } else if (source === 'result' && resultBandData) {
                text = `私の邦ロックバンド診断結果は「${resultBandData.name}」でした！\n${resultBandData.description}`;
            }

            const twitterUrl = `https://twitter.com/intent/tweet?text=${encodeURIComponent(text + '\n' + hashtag)}&url=${encodeURIComponent(url)}`;
            window.open(twitterUrl, '_blank');
        }

    </script>
</body>
